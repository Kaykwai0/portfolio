<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>作品集 · Kay</title>
<style>
  :root{
    --bg:#f4f3f8; --card:#ffffff; --ink:#241b3a; --ink-2:#7d7890;
    --line:#e8e5f0; --purple:#5b2d90;
    --grad:linear-gradient(135deg,#432681 0%,#7c35a5 55%,#c2479d 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    line-height:1.6;
  }
  .serif{font-family:inherit;}

  /* ---------- hero header ---------- */
  header{
    margin:28px 5vw 0; padding:46px 42px 42px;
    background:var(--grad); border-radius:28px; color:#fff;
    box-shadow:0 18px 44px rgba(76,38,134,.28);
    position:relative; overflow:hidden;
  }
  header::after{content:'';position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08);}
  header .chip{
    display:inline-flex;align-items:center;justify-content:center;
    width:62px;height:62px;border-radius:16px;background:#fff;color:var(--purple);
    font-weight:800;font-size:17px;letter-spacing:.1em;margin-bottom:24px;
    box-shadow:0 6px 18px rgba(0,0,0,.2);overflow:hidden;
  }
  header .chip img{width:100%;height:100%;object-fit:contain;}
  header .kicker{display:none;}
  header h1{font-size:clamp(30px,4.6vw,50px);font-weight:800;letter-spacing:.05em;}
  header .sub{margin-top:12px;color:rgba(255,255,255,.85);font-size:13px;letter-spacing:.08em;}
  header .stats{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative;z-index:1;}
  header .stats span{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
    border-radius:999px;padding:8px 20px;font-size:13px;letter-spacing:.1em;color:#fff;
  }
  header .stats b{font-size:16px;margin-right:5px;font-weight:800;}
  .rule{display:none;}

  /* ---------- tabs ---------- */
  nav{position:sticky;top:0;z-index:50;background:rgba(244,243,248,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 5vw;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:8px 18px;border-radius:999px;font-size:13px;letter-spacing:.06em;cursor:pointer;
    transition:all .25s ease;white-space:nowrap;
  }
  .tab .n{opacity:.55;font-size:11px;margin-left:5px;}
  .tab.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(124,53,165,.35);}
  .tab:hover:not(.on){border-color:#cfc4e6;color:var(--ink);}

  /* ---------- sections ---------- */
  main{padding:8px 5vw 40px;}
  section{margin-top:44px;}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;}
  .sec-head h2{font-size:clamp(20px,2.6vw,26px);font-weight:800;letter-spacing:.1em;}
  .sec-head .cnt{font-size:12px;color:#fff;background:var(--grad);border-radius:999px;padding:3px 13px;letter-spacing:.12em;}
  .sec-head .ln{flex:1;height:1px;background:var(--line);}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(max-width:1199px) and (min-width:760px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:759px){.grid{grid-template-columns:repeat(2,1fr);gap:12px;}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(76,38,134,.16);}
  .ph{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#efedf5;}
  .ph img{
    width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;
    transition:transform .6s ease;
  }
  .card:hover .ph img{transform:scale(1.05);}
  .ph .badge{
    position:absolute;left:12px;top:12px;z-index:2;font-size:10px;letter-spacing:.14em;
    background:rgba(36,27,58,.72);color:#fff;padding:4px 11px;border-radius:999px;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;}
  .meta .t{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .meta .c{font-size:10px;color:var(--ink-2);letter-spacing:.1em;flex:0 0 auto;margin-left:10px;background:#f3f0fa;border-radius:999px;padding:3px 10px;}

  /* ---------- lightbox ---------- */
  #lb{position:fixed;inset:0;z-index:200;display:none;background:rgba(24,18,40,.92);}
  #lb.open{display:flex;flex-direction:column;}
  #lb .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#efeaff;flex:0 0 auto;}
  #lb .bar .tt{font-size:14px;letter-spacing:.08em;}
  #lb .bar .x{cursor:pointer;font-size:22px;line-height:1;padding:2px 8px;opacity:.8;}
  #lb .bar .x:hover{opacity:1;}
  #lb .stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:0 16px 26px;-webkit-overflow-scrolling:touch;}
  #lb .stage img{max-width:min(92vw,980px);height:auto;border-radius:12px;}
  #lb .dots{flex:0 0 auto;display:flex;gap:8px;justify-content:center;padding:12px;}
  #lb .dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.32);cursor:pointer;}
  #lb .dots span.on{background:#fff;}
  #lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#efeaff;cursor:pointer;padding:14px;user-select:none;opacity:.65;}
  #lb .nav:hover{opacity:1;}
  #lb .prev{left:6px;} #lb .next{right:6px;}

  /* ---------- footer / states ---------- */
  footer{margin:34px 5vw 0;padding:26px 6px 44px;color:var(--ink-2);font-size:12px;letter-spacing:.18em;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  #status{text-align:center;color:var(--ink-2);font-size:13px;letter-spacing:.2em;padding:70px 0;}
  .hint{font-size:11px;color:var(--ink-2);letter-spacing:.1em;margin-top:6px;}
  @media(max-width:759px){
    header{margin:16px 4vw 0;padding:36px 26px 32px;border-radius:22px;}
    header .chip{width:54px;height:54px;margin-bottom:18px;}
    footer{margin:26px 4vw 0;}
  }
</style>
</head>

牙刷详情页繁體字","width":790}],"宽":790,"来源":"xdZ406bHOneKwZU1hfylrT","标题":"高露洁0压感小方头牙刷详情页繁體字","高":4780},{"分类":"电商活动详情页","加入时间":"2026-10-30T00:00:00Z","图片":[{"height":4611,"id":"psZraMqcPM2P","imageUrl":"https://workbuddy-space-static.codebuddy.work/image/P95He0fLtileuYpPD2ceRv.jpg","title":"猫超新客页面app","width":637}],"宽":637,"来源":"GaeUPt3ZIhvNOL5vog8R1e","标题":"猫超新客页面app","高":4611},{"分类":"电商活动详情页","加入时间":"2026-10-30T00:00:00Z","图片":[{"height":5094,"id":"QZhMgfK1FiEw","imageUrl":"https://workbuddy-space-static.codebuddy.work/image/H6HJQ6P2VxsxmlmBZcg2BH.jpg","title":"27741564129958_.pic_hd","width":636}],"宽":636,"来源":"BWuDiTcCXa0JEy3beMwUmV","标题":"电商页面 · 18","高":5094},{"分类":"人物产品设计精修","加入时间":"2026-10-30T00:00:00Z","图片":[{"height":2132,"id":"m9h96YbFoidg","imageUrl":"https://workbuddy-space-static.codebuddy.work/image/ahd4wT8bx6XYYBEXpjOR9W.jpg","title":"截屏2026-10-30 17.21.45","width":1600}],"宽":1600,"来源":"89dAhnfW0fY8Sq0k2RSyP0","标题":"卡姿兰 Pink My Way · 限定系列精修","高":2132},{"分类":"人物产品设计精修","加入时间":"2026-10-30T00:00:00Z","图片":[{"height":2162,"id":"BRCQFsiyusuL","imageUrl":"https://workbuddy-space-static.codebuddy.work/image/PrwgRAfWvtcQEXul1H3lu1.jpg","title":"截屏2026-10-30 17.22.26","width":1600}],"宽":1600,"来源":"i8u8PWODtFsWRXi7y9RnOm","标题":"卡姿兰唇釉 · 双瓶悬浮精修","高":2162}];</script>
<script>
(function(){
  var db = window.__SMART_PAGE__ && window.__SMART_PAGE__.database;
  var EMBEDDED = window.__ROWS__ || null;
  var DATABASE_ID = 'YATeLXk2ESKimNsF0uIH67';
  var CAT_ORDER = ['KV','电商活动详情页','人物产品设计精修','企业官网UI设计','线下产品包装posm','产品摄影','品牌guideline']; // 固定顺序
  var ORDER_NAME = {'KV':'KV','产品摄影':'产品摄影','人物产品设计精修':'人物产品设计精修','企业官网UI设计':'企业官网UI设计','品牌guideline':'品牌 Guideline','线下产品包装posm':'线下包装 · POSM','电商活动详情页':'电商活动 · 详情页'};
  var works = [];

  var useEmbedded = !db;

  function queryPage(startCursor, acc, guard){
    acc = acc || []; guard = guard || 0;
    if(guard > 60){ render(acc); return; }
    db.query({
      databaseId: DATABASE_ID,
      sorts: [{ property: '加入时间', direction: 'descending' }],
      pageSize: 200,
      startCursor: startCursor
    }).then(function(res){
      acc = acc.concat(res.results || []);
      var next = res.nextCursor;
      if(res.hasMore && next && next !== startCursor && (res.results||[]).length){
        queryPage(next, acc, guard+1);
      } else { render(acc); }
    }).catch(function(e){
      console.error(e);
      document.getElementById('status').textContent = '数据载入失败，请稍后刷新';
    });
  }

  function firstImg(row){
    var arr = row['图片'];
    if(!arr || !arr.length) return null;
    return arr;
  }

  function render(rows){
    works = [];
    (rows||[]).forEach(function(r){
      var imgs = firstImg(r); if(!imgs || !imgs.length) return;
      works.push({
        title: r['标题'] || '未命名作品',
        cat: r['分类'] || '其他',
        imgs: imgs.map(function(x){ return {url:x.imageUrl, w:x.width||0, h:x.height||0}; }),
        w: r['宽'] || (imgs[0].width||1),
        h: r['高'] || (imgs[0].height||1),
        date: r['加入时间'] || ''
      });
    });
    buildTabs();
    buildSections('全部');
    var cs={}; works.forEach(function(x){ cs[x.cat]=1; });
    var sw=document.getElementById('st-works'), sc=document.getElementById('st-cats');
    if(sw) sw.textContent=works.length;
    if(sc) sc.textContent=Object.keys(cs).length;
    document.getElementById('status').style.display='none';
  }

  function catOrder(counts){
    // 按文件夹固定顺序：KV → 产品摄影 → 人物产品设计精修 → 企业官网UI设计
    return CAT_ORDER.filter(function(c){return counts[c]>0;});
  }

  function buildTabs(){
    var counts = {};
    works.forEach(function(x){ counts[x.cat]=(counts[x.cat]||0)+1; });
    var order = ['全部'].concat(catOrder(counts));
    counts['全部']=works.length;
    var nav = document.getElementById('tabs'); nav.innerHTML='';
    order.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='tab'+(i===0?' on':'');
      b.innerHTML=(c==='全部'?'全部':ORDER_NAME[c]||c)+'<span class="n">'+counts[c]+'</span>';
      b.onclick=function(){
        Array.prototype.forEach.call(nav.children,function(el){el.classList.remove('on');});
        b.classList.add('on');
        buildSections(c);
        window.scrollTo({top:document.getElementById('main').offsetTop-70,behavior:'smooth'});
      };
      nav.appendChild(b);
    });
  }

  function buildSections(sel){
    var main=document.getElementById('main');
    main.innerHTML='';
    var counts={}, byCat={};
    works.forEach(function(x){ (byCat[x.cat]=byCat[x.cat]||[]).push(x); counts[x.cat]=(counts[x.cat]||0)+1; });
    var list = sel==='全部' ? catOrder(counts) : [sel];
    list.forEach(function(cat){
      var items=byCat[cat]; if(!items||!items.length) return;
      var sec=document.createElement('section');
      var head=document.createElement('div'); head.className='sec-head';
      head.innerHTML='<h2 class="serif">'+(ORDER_NAME[cat]||cat)+'</h2><span class="cnt">'+items.length+' 件</span><span class="ln"></span>';
      sec.appendChild(head);
      var grid=document.createElement('div'); grid.className='grid';
      items.forEach(function(w,idx){ grid.appendChild(card(w, works.indexOf(w))); });
      sec.appendChild(grid);
      main.appendChild(sec);
    });
    if(!main.children.length){ main.innerHTML='<div id="status">该分类暂无作品</div>'; }
  }

  function card(w, gi){
    var ratio = w.h && w.w ? w.h/w.w : 1;
    var el=document.createElement('div'); el.className='card';
    var ph=document.createElement('div'); ph.className='ph';
    var img=document.createElement('img');
    img.src=w.imgs[0].url; img.loading='lazy'; img.alt=w.title;
    if(ratio>=1.9){ img.style.objectPosition='50% 0%'; }   // 长图取顶部
    else if(ratio<=0.55){ img.style.objectPosition='50% 50%'; }
    ph.appendChild(img);
    if(ratio>=1.9){                                        // 长页面角标
      var b=document.createElement('span'); b.className='badge'; b.textContent='长图 · 完整预览'; ph.appendChild(b);
    }
    var meta=document.createElement('div'); meta.className='meta';
    meta.innerHTML='<span class="t">'+w.title+'</span><span class="c">'+w.imgs.length+'P</span>';
    el.appendChild(ph); el.appendChild(meta);
    el.onclick=function(){ openLb(gi,0); };
    return el;
  }

  /* ---------- lightbox ---------- */
  var cur=0, ci=0;
  var lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'),
      lbTt=document.getElementById('lb-tt'), lbDots=document.getElementById('lb-dots');
  function openLb(gi,i){
    cur=gi; ci=i; paint();
    lb.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function paint(){
    var w=works[cur], im=w.imgs[ci];
    lbImg.src=im.url;
    lbImg.style.maxHeight='none';
    lbTt.textContent=w.title+(w.imgs.length>1?('  ·  '+(ci+1)+'/'+w.imgs.length):'');
    lbDots.innerHTML='';
    if(w.imgs.length>1){
      w.imgs.forEach(function(_,i){
        var s=document.createElement('span'); if(i===ci) s.className='on';
        s.onclick=function(){ ci=i; paint(); };
        lbDots.appendChild(s);
      });
    }
    document.getElementById('lb-prev').style.display = w.imgs.length>1?'block':'none';
    document.getElementById('lb-next').style.display = w.imgs.length>1?'block':'none';
  }
  function closeLb(){ lb.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('lb-x').onclick=closeLb;
  lb.addEventListener('click',function(e){ if(e.target===lb||e.target.id==='lb-stage') closeLb(); });
  document.getElementById('lb-prev').onclick=function(){ var w=works[cur]; ci=(ci-1+w.imgs.length)%w.imgs.length; paint(); };
  document.getElementById('lb-next').onclick=function(){ var w=works[cur]; ci=(ci+1)%w.imgs.length; paint(); };
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') closeLb();
    if(e.key==='ArrowLeft') document.getElementById('lb-prev').click();
    if(e.key==='ArrowRight') document.getElementById('lb-next').click();
  });

  if(!useEmbedded){
    try{ queryPage(undefined, [], 0); }catch(e){ document.getElementById('status').textContent='数据载入失败，请稍后刷新'; }
  } else if(EMBEDDED && EMBEDDED.length){
    render(EMBEDDED);
  } else {
    document.getElementById('status').textContent = '数据通道未就绪，请稍后刷新';
  }
})();
</script>
</body>
</html>
